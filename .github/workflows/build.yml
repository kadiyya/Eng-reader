name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk EngReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EngReader-apk
          path: EngReader.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EngReader v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Telefona indirip kurmak için aşağıdaki EngReader.apk dosyasını kullan."
          files: EngReader.apk
